<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wiki Física para TIC | Hardware y Leyes Físicas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="container nav-content">
      <h1>Physic<span>TIC</span> Wiki</h1>
      <p class="subtitle">Base de datos interactiva de física aplicada al hardware computacional</p>
    </div>
  </header>

  <main class="container">
    <!-- Panel de búsqueda y filtro -->
    <section class="controls-panel">
      <div class="search-box">
        <input type="text" id="searchInput" aria-label="Buscar" placeholder="Buscar por ley, componente o principio (ej. Joule, DRAM, VRM)">
      </div>
      <div class="filter-box">
        <label for="categoryFilter">Categoría física:</label>
        <select id="categoryFilter">
          <option value="Todas">Todas las áreas</option>
        </select>
      </div>
    </section>

    <!-- Mensaje de estado (carga / error) -->
    <div id="loadingStatus" class="status-msg" role="status">Cargando registros científicos...</div>

    <!-- Rejilla de tarjetas -->
    <section id="cardsGrid" class="grid-container"></section>
  </main>

  <!-- Ventana de detalle técnico -->
  <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Detalle técnico">
    <div class="modal-content">
      <button class="close-modal" id="closeModalBtn" aria-label="Cerrar">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
